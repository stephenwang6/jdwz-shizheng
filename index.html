const bank = [];
function q(cat, type, stem, opts, ans, exp) {
  if (!cat || !["s", "m"].includes(type) || !stem || !Array.isArray(opts) || opts.length < 2) throw new Error("题目数据格式错误");
  if (type === "s" && (!Number.isInteger(ans) || ans < 0 || ans >= opts.length)) throw new Error("单选题答案格式错误");
  if (type === "m" && (!Array.isArray(ans) || ans.length < 2 || ans.some(i => !Number.isInteger(i) || i < 0 || i >= opts.length))) throw new Error("多选题答案格式错误");
  bank.push({ id: bank.length + 1, cat, type, stem, opts, ans, exp });
}

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
const STORE_KEY = "shizheng_chapter4_bank_v4";
const LETTERS = "ABCDEFGHIJKLMN";
let storageOK = true;
let storageWarned = false;
let toastTimer = null;
let practice = null;
let exam = null;
let state = { records: {}, favorites: {}, wrong: {}, skipCorrect: false };

try {
  localStorage.setItem("__bank_test__", "1");
  localStorage.removeItem("__bank_test__");
} catch (e) { storageOK = false; }

if (storageOK) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved === "object") {
      state.records = saved.records && typeof saved.records === "object" ? saved.records : {};
      state.favorites = saved.favorites && typeof saved.favorites === "object" ? saved.favorites : {};
      state.skipCorrect = saved.skipCorrect === true;
    }
  } catch (e) { /* 损坏的数据不阻塞页面，使用空记录 */ }
}
reconcileWrong();

function reconcileWrong() {
  state.wrong = {};
  Object.keys(state.records).forEach(id => {
    if (state.records[id] && state.records[id].correct === false) state.wrong[id] = true;
  });
}
function save() {
  if (!storageOK) { warnStorage(); return; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; warnStorage(); }
}
function warnStorage() {
  if (storageWarned) return;
  storageWarned = true;
  setTimeout(() => toast("本机存储不可用，进度仅保留在当前页面"), 100);
}
function toast(msg) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
function esc(v) {
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function byId(id) { return bank.find(q => q.id === Number(id)); }
function norm(ans) { return (Array.isArray(ans) ? ans : [ans]).map(Number).sort((a,b) => a-b); }
function sameAnswer(a, b) { const x=norm(a), y=norm(b); return x.length===y.length && x.every((v,i)=>v===y[i]); }
function isCorrect(question, ans) { return sameAnswer(ans, question.ans); }
function answerLetters(question, ans) {
  const arr = Array.isArray(ans) ? ans : (ans == null ? [] : [ans]);
  return arr.length ? arr.map(i => LETTERS[i]).join("、") : "未作答";
}
function answeredIds() { return Object.keys(state.records).filter(id => byId(id) && state.records[id]); }
function correctIds() { return answeredIds().filter(id => state.records[id].correct === true); }
function wrongIds() { return answeredIds().filter(id => state.records[id].correct === false); }
function favoriteIds() { return Object.keys(state.favorites).filter(id => state.favorites[id] && byId(id)); }
function recordAnswer(question, ans) {
  const correct = isCorrect(question, ans);
  state.records[question.id] = { ans: norm(ans), correct, time: Date.now() };
  if (correct) delete state.wrong[question.id]; else state.wrong[question.id] = true;
  save();
  return correct;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function rate(correct, total) { return total ? Math.round(correct/total*100) : 0; }
function progressHtml(value, total) { return '<div class="progress"><i style="width:'+rate(value,total)+'%"></i></div>'; }
function goTop() { window.scrollTo({ top:0, behavior:"smooth" }); }

function renderHome() {
  const practiced = answeredIds(), correct = correctIds(), wrong = wrongIds(), favorites = favoriteIds();
  const randomCount = bank.filter(q => !state.skipCorrect || !state.records[q.id] || state.records[q.id].correct !== true).length;
  const modes = [
    ["random","随机练习",(state.skipCorrect?"未答对题目":"全部题目")+"随机抽取，每次最多15题",Math.min(15,randomCount)],
    ["exam","模拟考试","随机抽取最多50题",Math.min(50,bank.length)],
    ["wrong","答错的题","重新答对后自动移出",wrong.length],
    ["correct","答对的题","历史记录当前为正确",correct.length],
    ["favorite","收藏练习","随时添加或取消收藏",favorites.length]
  ];
  const cats = [...new Set(bank.map(q=>q.cat))];
  app.innerHTML = '<header class="hero"><h1>第四章 时事政治</h1><p>单文件答题题库</p><p class="count">共 '+bank.length+' 题｜单选 '+bank.filter(q=>q.type==="s").length+' 题｜多选 '+bank.filter(q=>q.type==="m").length+' 题</p></header>'
    +'<main class="wrap"><section class="stats">'
    +'<div class="stat"><b>'+practiced.length+'</b><span>已练习</span></div>'
    +'<div class="stat"><b>'+rate(correct.length,practiced.length)+'%</b><span>正确率</span></div>'
    +'<div class="stat"><b>'+wrong.length+'</b><span>错题</span></div>'
    +'<div class="stat"><b>'+favorites.length+'</b><span>收藏</span></div></section>'
    +'<h2>练习模式</h2><section class="modes">'+modes.map(m=>'<button class="mode" data-action="start-mode" data-mode="'+m[0]+'"><span class="badge">'+m[3]+'</span><strong>'+m[1]+'</strong><small>'+m[2]+'</small></button>').join("")+'</section>'
    +'<section class="card switch-row"><div><strong>跳过已答对的题</strong><small>用于随机练习和章节练习</small></div><label class="switch"><input id="skipSwitch" type="checkbox" '+(state.skipCorrect?"checked":"")+' aria-label="跳过已答对的题"><span class="slider"></span></label></section>'
    +'<h2>章节练习</h2><section>'+cats.map(cat=>{
      const all=bank.filter(q=>q.cat===cat), done=all.filter(q=>state.records[q.id]), right=done.filter(q=>state.records[q.id].correct===true);
      const eligible=all.filter(q=>!state.skipCorrect||!state.records[q.id]||state.records[q.id].correct!==true).length;
      return '<div class="card chapter"><button class="chapter-btn" data-action="start-chapter" data-cat="'+esc(cat)+'"><div class="chapter-line"><span>'+esc(cat)+'</span><span>'+eligible+' 题可练</span></div><div class="chapter-meta">总题数 '+all.length+'｜已练 '+done.length+'｜答对 '+right.length+'</div>'+progressHtml(done.length,all.length)+'</button></div>';
    }).join("")+'</section>'
    +'<button class="danger" data-action="clear-records">清空练习记录</button>'
    +'<p class="local-note">进度仅保存在本机，不上传数据<br>收藏和“跳过已答对”开关会在刷新后保留</p></main>';
}

function startMode(mode) {
  if (mode === "exam") { startExam(); return; }
  let ids=[], title="";
  if (mode === "random") { ids=bank.filter(q=>!state.skipCorrect||!state.records[q.id]||state.records[q.id].correct!==true).map(q=>q.id); ids=shuffle(ids).slice(0,15); title="随机练习"; }
  if (mode === "wrong") { ids=wrongIds().map(Number); title="答错的题"; }
  if (mode === "correct") { ids=correctIds().map(Number); title="答对的题"; }
  if (mode === "favorite") { ids=favoriteIds().map(Number); title="收藏练习"; }
  startPractice(ids,title);
}
function startChapter(cat) {
  const ids=bank.filter(q=>q.cat===cat&&(!state.skipCorrect||!state.records[q.id]||state.records[q.id].correct!==true)).map(q=>q.id);
  startPractice(ids,cat);
}
function startPractice(ids,title) {
  if (!ids.length) { toast("当前分组没有可练习的题目"); return; }
  practice={ids:ids.slice(),title,index:0,responses:{},drafts:{},done:false,result:null};
  exam=null; renderPractice(); goTop();
}
function practiceCurrent() { return byId(practice.ids[practice.index]); }
function practiceSelection(question) {
  const response=practice.responses[question.id];
  return response ? response.ans : (practice.drafts[question.id] || []);
}
function toggleFavorite(question) {
  if (state.favorites[question.id]) { delete state.favorites[question.id]; toast("已取消收藏"); }
  else { state.favorites[question.id]=true; toast("已加入收藏"); }
  save();
}
function topbar(title, question, examMode) {
  return '<div class="topbar"><div class="topbar-inner"><button class="btn small" data-action="go-home">返回</button><div class="topbar-title">'+esc(title)+'</div>'
    +(question?'<button class="btn small '+(state.favorites[question.id]?"active":"")+'" data-action="favorite">'+(state.favorites[question.id]?"已收藏":"收藏")+'</button>':"")
    +(examMode?'<button class="btn small primary" data-action="submit-exam">交卷</button>':"")+'</div></div>';
}
function renderPractice() {
  if (practice.done) { renderPracticeResult(); return; }
  const question=practiceCurrent(), response=practice.responses[question.id], selected=practiceSelection(question), locked=!!response;
  const options=question.opts.map((opt,i)=>{
    let cls="option";
    if (selected.includes(i)) cls+=" selected";
    if (locked && norm(question.ans).includes(i)) cls+=" correct";
    if (locked && selected.includes(i) && !norm(question.ans).includes(i)) cls+=" wrong";
    return '<button class="'+cls+'" data-action="select-option" data-index="'+i+'" '+(locked?"disabled":"")+'><span class="letter">'+LETTERS[i]+'.</span><span>'+esc(opt)+'</span></button>';
  }).join("");
  app.innerHTML=topbar(practice.title,question,false)+'<main class="wrap session-wrap">'
    +'<div class="qmeta"><span class="tag">'+(question.type==="s"?"单选题":"多选题")+'</span><span class="tag gray">'+esc(question.cat)+'</span><span class="tag gray">第 '+(practice.index+1)+' / '+practice.ids.length+' 题</span></div>'
    +progressHtml(practice.index+1,practice.ids.length)
    +'<section class="card"><div class="stem">'+esc(question.stem)+'</div><div class="options">'+options+'</div>'
    +(question.type==="m"&&!locked?'<button class="btn primary multi-submit" data-action="submit-multi" '+(selected.length?"":"disabled")+'>提交答案（已选 '+selected.length+' 项）</button>':"")
    +(locked?'<div class="explanation"><p class="'+(response.correct?"right":"wrong-text")+'">'+(response.correct?"回答正确":"回答错误")+'</p><p><b>我的答案：</b>'+answerLetters(question,response.ans)+'</p><p><b>正确答案：</b>'+answerLetters(question,question.ans)+'</p><p><b>解析：</b>'+esc(question.exp)+'</p></div>':"")
    +'</section></main>'
    +'<div class="bottombar"><div class="bottombar-inner"><button class="btn" data-action="practice-prev" '+(practice.index===0?"disabled":"")+'>上一题</button><button class="btn primary" data-action="practice-next">'+(practice.index===practice.ids.length-1?"完成练习":"下一题")+'</button></div></div>';
}
function selectPracticeOption(index) {
  const question=practiceCurrent();
  if (practice.responses[question.id]) return;
  if (question.type==="s") {
    const correct=recordAnswer(question,[index]);
    practice.responses[question.id]={ans:[index],correct};
    delete practice.drafts[question.id];
  } else {
    const draft=practice.drafts[question.id]||[];
    practice.drafts[question.id]=draft.includes(index)?draft.filter(i=>i!==index):draft.concat(index);
  }
  renderPractice();
}
function submitPracticeMulti() {
  const question=practiceCurrent(), selected=practice.drafts[question.id]||[];
  if (!selected.length || practice.responses[question.id]) return;
  const correct=recordAnswer(question,selected);
  practice.responses[question.id]={ans:norm(selected),correct};
  delete practice.drafts[question.id];
  renderPractice();
}
function finishPractice() {
  const unanswered=practice.ids.filter(id=>!practice.responses[id]).length;
  if (unanswered && !confirm("还有 "+unanswered+" 题未作答，确定完成练习吗？")) return;
  const responses=Object.values(practice.responses), correct=responses.filter(r=>r.correct).length, wrong=responses.length-correct;
  practice.result={correct,wrong,unanswered,rate:rate(correct,responses.length)};
  practice.done=true; renderPracticeResult(); goTop();
}
function renderPracticeResult() {
  const r=practice.result;
  app.innerHTML=topbar("练习结果",null,false)+'<main class="wrap"><section class="card result"><h2>'+esc(practice.title)+'</h2><div class="score">'+r.rate+'%</div><p>正确率</p><p><span class="right">答对 '+r.correct+' 题</span>　<span class="wrong-text">答错 '+r.wrong+' 题</span></p>'+(r.unanswered?'<p class="muted">未作答 '+r.unanswered+' 题</p>':"")+'<div class="result-actions"><button class="btn primary" data-action="retry-practice">再练一遍</button><button class="btn" data-action="start-wrong">查看错题</button><button class="btn" data-action="go-home">返回首页</button></div></section></main>';
}

function startExam() {
  if (!bank.length) { toast("题库为空，无法开始考试"); return; }
  exam={ids:shuffle(bank.map(q=>q.id)).slice(0,50),index:0,answers:{},result:null};
  practice=null; renderExam(); goTop();
}
function examCurrent() { return byId(exam.ids[exam.index]); }
function renderExam() {
  if (exam.result) { renderExamResult(); return; }
  const question=examCurrent(), selected=exam.answers[question.id]||[];
  const options=question.opts.map((opt,i)=>'<button class="option '+(selected.includes(i)?"selected":"")+'" data-action="exam-option" data-index="'+i+'"><span class="letter">'+LETTERS[i]+'.</span><span>'+esc(opt)+'</span></button>').join("");
  app.innerHTML=topbar("模拟考试",question,true)+'<main class="wrap session-wrap"><div class="notice">考试过程中不显示答案和解析，交卷后统一计分。</div>'
    +'<div class="qmeta"><span class="tag">'+(question.type==="s"?"单选题":"多选题")+'</span><span class="tag gray">'+esc(question.cat)+'</span><span class="tag gray">第 '+(exam.index+1)+' / '+exam.ids.length+' 题</span></div>'
    +progressHtml(exam.index+1,exam.ids.length)+'<section class="card"><div class="stem">'+esc(question.stem)+'</div><div class="options">'+options+'</div></section></main>'
    +'<div class="bottombar"><div class="bottombar-inner"><button class="btn" data-action="exam-prev" '+(exam.index===0?"disabled":"")+'>上一题</button><button class="btn primary" data-action="exam-next">'+(exam.index===exam.ids.length-1?"交卷":"下一题")+'</button></div></div>';
}
function selectExamOption(index) {
  const question=examCurrent(), selected=exam.answers[question.id]||[];
  if (question.type==="s") exam.answers[question.id]=[index];
  else exam.answers[question.id]=selected.includes(index)?selected.filter(i=>i!==index):selected.concat(index);
  renderExam();
}
function submitExam() {
  if (exam.result) return;
  const unanswered=exam.ids.filter(id=>!(exam.answers[id]||[]).length).length;
  const message=unanswered?"还有 "+unanswered+" 题未作答，未答题按错误计分。确定交卷吗？":"已完成全部题目，确定交卷吗？";
  if (!confirm(message)) return;
  let correct=0;
  exam.ids.forEach(id=>{
    const question=byId(id), ans=exam.answers[id]||[], right=recordAnswer(question,ans);
    exam.answers[id]=norm(ans);
    if (right) correct++;
  });
  const score=Math.round(correct/exam.ids.length*100);
  exam.result={score,correct,wrong:exam.ids.length-correct,pass:score>=60};
  renderExamResult(); goTop();
}
function renderExamResult() {
  const r=exam.result;
  const wrong=exam.ids.map(byId).filter(question=>!isCorrect(question,exam.answers[question.id]||[]));
  app.innerHTML=topbar("考试结果",null,false)+'<main class="wrap"><section class="card result"><h2>模拟考试成绩</h2><div class="score">'+r.score+' 分</div><p class="'+(r.pass?"pass":"fail")+'">'+(r.pass?"已达到60分及格线":"未达到60分及格线")+'</p><p><span class="right">答对 '+r.correct+' 题</span>　<span class="wrong-text">答错／未答 '+r.wrong+' 题</span></p><div class="result-actions"><button class="btn primary" data-action="retry-exam">再考一次</button><button class="btn" data-action="go-home">返回首页</button></div></section>'
    +'<h2>错题回顾</h2><section class="review">'+(wrong.length?wrong.map(question=>'<details><summary>第 '+question.id+' 题｜'+esc(question.stem)+'</summary><div class="review-body"><div class="answer-line"><b>我的答案：</b>'+answerLetters(question,exam.answers[question.id]||[])+'</div><div class="answer-line"><b>正确答案：</b>'+answerLetters(question,question.ans)+'</div><p><b>解析：</b>'+esc(question.exp)+'</p></div></details>').join(""):'<div class="card empty">本场全部答对，没有错题。</div>')+'</section></main>';
}

app.addEventListener("click", event => {
  const el=event.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const action=el.dataset.action;
  if (action==="start-mode") startMode(el.dataset.mode);
  else if (action==="start-chapter") startChapter(el.dataset.cat);
  else if (action==="go-home") {
    if (exam&&!exam.result&&!confirm("确定退出本场考试吗？本场未交卷作答不会计入成绩。")) return;
    practice=null;exam=null;renderHome();goTop();
  }
  else if (action==="clear-records") {
    if (!confirm("确定清空全部练习记录和错题吗？收藏与开关设置将保留。")) return;
    if (!confirm("请再次确认：清空后练习记录无法恢复。")) return;
    state.records={};state.wrong={};save();renderHome();toast("练习记录已清空，收藏和开关已保留");
  }
  else if (action==="favorite") { const current=exam?examCurrent():practiceCurrent(); toggleFavorite(current); if(exam)renderExam();else renderPractice(); }
  else if (action==="select-option") selectPracticeOption(Number(el.dataset.index));
  else if (action==="submit-multi") submitPracticeMulti();
  else if (action==="practice-prev") { if(practice.index>0){practice.index--;renderPractice();goTop();} }
  else if (action==="practice-next") { if(practice.index<practice.ids.length-1){practice.index++;renderPractice();goTop();}else finishPractice(); }
  else if (action==="retry-practice") startPractice(practice.ids,practice.title);
  else if (action==="start-wrong") startMode("wrong");
  else if (action==="exam-option") selectExamOption(Number(el.dataset.index));
  else if (action==="exam-prev") { if(exam.index>0){exam.index--;renderExam();goTop();} }
  else if (action==="exam-next") { if(exam.index<exam.ids.length-1){exam.index++;renderExam();goTop();}else submitExam(); }
  else if (action==="submit-exam") submitExam();
  else if (action==="retry-exam") startExam();
});
app.addEventListener("change", event => {
  if (event.target.id!=="skipSwitch") return;
  state.skipCorrect=event.target.checked;save();renderHome();toast(state.skipCorrect?"已开启：随机和章节练习跳过答对题":"已关闭：随机和章节练习包含答对题");
});

renderHome();
if (!storageOK) warnStorage();
</script>
</body>
</html>
